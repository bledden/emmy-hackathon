<svg xmlns="http://www.w3.org/2000/svg" width="960" height="810" viewBox="0 0 960 810" role="img" aria-labelledby="title desc"><title id="title">From scheduled IR to GPU execution</title><desc id="desc">Two inputs enter the Python compiler. It emits PTX text. NVIDIA assembles that text, and a separate runner executes the native kernel on the GPU.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="810" rx="16" fill="#ffffff"/><style>text{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
<text x="40" y="43" font-size="13" fill="#52647a" font-weight="650" text-anchor="start" class="">FROM SCHEDULE TO EXECUTION</text>
<text x="40" y="82" font-size="29" fill="#172b4d" font-weight="650" text-anchor="start" class="">One compiler. Two execution environments.</text>
<rect x="40" y="116" width="420" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="62" y="151" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">Kernel IR JSON</text>
<text x="62" y="182" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Typed operations + supplied schedule</text>
<rect x="500" y="116" width="420" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="522" y="151" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">meta.json</text>
<text x="522" y="182" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Launch geometry + buffer argument order</text>
<path d="M 250 216 V 246 H 480" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 710 216 V 246 H 480 V 282" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="40" y="282" width="880" height="260" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="64" y="315" font-size="13" fill="#2563eb" font-weight="650" text-anchor="start" class="">01  /  THIS REPOSITORY</text>
<text x="64" y="349" font-size="25" fill="#172b4d" font-weight="650" text-anchor="start" class="">Python runs on the host</text>
<rect x="64" y="376" width="246" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="86" y="411" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">Load &amp; bind</text>
<text x="86" y="442" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Reconstruct typed IR</text>
<text x="86" y="467" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Match its metadata</text>
<rect x="358" y="376" width="246" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="380" y="411" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">Check &amp; lower</text>
<text x="380" y="442" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Translate statements</text>
<text x="380" y="467" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Apply eligible passes</text>
<rect x="652" y="376" width="244" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="674" y="411" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">Emit PTX</text>
<text x="674" y="442" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Program text</text>
<text x="674" y="467" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Written to stdout</text>
<path d="M 310 439 H 354" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 604 439 H 648" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 774 502 V 565 H 430 V 601" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="589" font-size="13" fill="#52647a" font-weight="650" text-anchor="start" class="">02  /  OUTSIDE THE COMPILER</text>
<rect x="40" y="606" width="420" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="62" y="641" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">NVIDIA assembler</text>
<text x="62" y="672" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">PTX → native GPU instructions</text>
<text x="62" y="697" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Target selected by the assembly service</text>
<rect x="500" y="606" width="420" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="522" y="641" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">Runner + GPU</text>
<text x="522" y="672" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Supply buffers and launch the kernel</text>
<text x="522" y="697" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Hosted qualification: RTX 5090 / sm_120</text>
<path d="M 460 669 H 496" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="777" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">The supplied schedule is preserved. No tensor computation runs in compile.py.</text>
</svg>
