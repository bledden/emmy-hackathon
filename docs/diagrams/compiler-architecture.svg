<text x="550" y="520" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">scalars.py</text>
<text x="550" y="545" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">float32_math.py</text>
