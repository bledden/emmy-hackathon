<text x="790" y="520" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">fragments.py</text>
<text x="790" y="545" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Explicit fragment IR</text>
<text x="790" y="570" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Checked lane mapping</text>
<text x="790" y="595" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Tensor instructions</text>
<path d="M 160 630 V 665 H 520 V 700" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="704" width="944" height="106" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="72" y="739" font-size="21" fill="#172b4d" font-weight="650" text-anchor="start" class="">launch.render applies the enabled PTX transformations</text>
<text x="72" y="770" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">FMA → index reuse → load grouping → unrolling → grouping → rebasing → constant division</text>
<text x="72" y="796" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Then it builds register declarations and returns the completed PTX text.</text>
<text x="48" y="851" font-size="16" fill="#52647a" font-weight="400" text-anchor="start" class="">Arrows show principal calls and responsibilities, not separate processes or a complete import graph.</text>
</svg>
