<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="880" viewBox="0 0 1040 880" role="img" aria-labelledby="title desc"><title id="title">Compiler responsibilities</title><desc id="desc">The CLI calls compile_file, which configures one Emitter. That object owns mutable compilation state and calls helpers for launch, analysis, math and fragments. launch.render applies the PTX transforms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1040" height="880" rx="16" fill="#ffffff"/><style>text{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}</style>
<text x="48" y="43" font-size="13" fill="#52647a" font-weight="650" text-anchor="start" class="">READ THE CODE IN THIS ORDER</text>
<text x="48" y="82" font-size="29" fill="#172b4d" font-weight="650" text-anchor="start" class="">One emitter owns the compilation state.</text>
<rect x="48" y="112" width="342" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="70" y="147" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">compile.py</text>
<text x="70" y="178" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">CLI policies, output and diagnostics</text>
<rect x="450" y="112" width="542" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="472" y="147" font-size="20" fill="#172b4d" font-weight="650" text-anchor="start" class="">ptxgen/compiler.py</text>
<text x="472" y="178" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Load IR, bind metadata, configure the emitter</text>
<path d="M 390 164 H 446" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 721 216 V 244 H 520 V 270" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="248" y="274" width="544" height="108" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="272" y="311" font-size="25" fill="#172b4d" font-weight="650" text-anchor="start" class="">Emitter</text>
<text x="272" y="340" font-size="18" fill="#52647a" font-weight="400" text-anchor="start" class="">Registers · bindings · lexical scope · instructions</text>
<text x="272" y="365" font-size="17" fill="#52647a" font-weight="400" text-anchor="start" class="">Walks the statement tree and calls helpers below</text>
